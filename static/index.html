<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>Cosmo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg"><div class="sky"></div><canvas id="stars"></canvas></div>

<section class="screen is-active" id="s-auth">
  <div class="col">
    <div class="head">
      <svg class="mark" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
      <h2 id="auth-title">Вход в <span class="brand">Cosmo</span></h2>
      <p class="sub">Сообщения хранятся только на вашем сервере.</p>
    </div>
    <div class="field"><div class="control">
      <input id="u" placeholder=" " autocomplete="username" maxlength="24"><label for="u">Имя пользователя</label>
    </div></div>
    <div class="field"><div class="control">
      <input id="p" type="password" placeholder=" " autocomplete="current-password" maxlength="128"><label for="p">Пароль (от 8 символов)</label>
    </div></div>
    <p class="form-error" id="err"></p>
    <div class="actions">
      <button class="btn btn-primary" id="go">Войти</button>
      <button class="btn btn-secondary" id="switch">Создать аккаунт</button>
    </div>
  </div>
</section>

<section class="screen" id="s-main">
  <aside class="list-pane">
    <div class="main-head"><div class="avatar me" id="me"></div><strong id="me-name"></strong>
      <button class="icon-btn" id="logout" title="Выйти" style="margin-left:auto">⎋</button></div>
    <div class="search-wrap"><input id="q" placeholder="Найти пользователя" autocomplete="off"></div>
    <ul class="chat-list" id="list"></ul>
  </aside>
  <main class="chat-pane">
    <div class="chat-empty">Выберите собеседника</div>
    <div class="chat" id="chat" hidden>
      <div class="chat-head">
        <button class="icon-btn" id="back" title="Назад">‹</button>
        <div class="avatar" id="peer-av"></div><div class="t" id="peer"></div>
      </div>
      <div class="messages" id="msgs"></div>
      <div class="composer">
        <textarea id="text" rows="1" placeholder="Сообщение" maxlength="4000"></textarea>
        <button class="send" id="send" title="Отправить">➤</button>
      </div>
    </div>
  </main>
</section>

<script src="/static/app.js"></script>
</body>
</html>
